# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # Every dependency here is lint/format tooling that ships as one shared
      # config, so routine bumps are reviewed and released together rather than
      # one pull request per package.
      lint-toolchain:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Majors stay ungrouped on purpose. A major bump of a plugin or of
    # typescript-eslint can add, remove, or re-scope rules for every consumer of
    # this config, so each one needs its own pull request and its own release.
